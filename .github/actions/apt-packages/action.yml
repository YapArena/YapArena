name: Install apt packages
description: >-
  Installs Ubuntu packages from cached .deb files when the runner image matches, and otherwise
  downloads them with retries and a fallback for a slow Azure mirror.

inputs:
  packages:
    description: Space-separated package names, for example "ffmpeg" or "postgresql-17".
    required: true
  postgresql-repository:
    description: "true adds the PostgreSQL (PGDG) apt repository before downloading."
    default: "false"

runs:
  using: composite
  steps:
    - name: Prepare package cache key
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        PGDG: ${{ inputs.postgresql-repository }}
      run: |
        # The cached set is exactly what apt downloaded on this runner image, so the key
        # includes the image version. A new image downloads again and saves a new set.
        hash="$(printf '%s|%s|v1' "$PACKAGES" "$PGDG" | sha256sum | cut -c1-16)"
        {
          echo "key=apt-${ImageOS:-unknown}-${ImageVersion:-unknown}-${hash}"
          echo "directory=${HOME}/.cache/ci-apt-packages"
        } >> "$GITHUB_OUTPUT"

    - name: Restore downloaded packages
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.directory }}
        key: ${{ steps.key.outputs.key }}

    - name: Install packages
      id: install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        PGDG: ${{ inputs.postgresql-repository }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        DIRECTORY: ${{ steps.key.outputs.directory }}
      run: |
        read -ra packages <<< "$PACKAGES"

        if [[ "$CACHE_HIT" == "true" ]]; then
          # Install the saved files against the packages already on this runner image, with
          # every package source hidden. Given the runner's own sources, apt re-resolves the
          # local paths and, on Ubuntu 26.04, downloads all of them again from the mirror
          # ("Need to get 66.4 MB"). Without sources it can neither download nor pick a
          # different build: a missing dependency fails before anything is installed.
          # --no-download cannot be used: apt then rejects local .deb paths.
          shopt -s nullglob
          cached=("$DIRECTORY"/*.deb)
          shopt -u nullglob
          no_lists="$(mktemp -d)"
          mkdir "$no_lists/partial"
          if (( ${#cached[@]} > 0 )) && sudo timeout 3m apt-get install --yes \
            --no-install-recommends -o Dir::Etc::SourceList=/dev/null \
            -o Dir::Etc::SourceParts="$no_lists" -o Dir::State::Lists="$no_lists" \
            "${cached[@]}"; then
            echo "Installed ${packages[*]} from ${#cached[@]} cached files, without downloading"
            exit 0
          fi
          echo "::warning::Cached packages did not install; downloading them instead"
        fi

        # Retry a mirror connection that sends nothing for 20 s instead of
        # waiting on it. A config file also covers the apt-get update that
        # apt.postgresql.org.sh runs, which command-line options cannot reach.
        printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "20";' \
          | sudo tee /etc/apt/apt.conf.d/80-ci-network-retries > /dev/null
        # azure.archive.ubuntu.com sometimes sends at 30-45 kB/s, which apt does not
        # treat as a failure. Dropping it from the runner's mirror list makes apt use
        # archive.ubuntu.com; files already downloaded are kept.
        avoid_azure() {
          echo "::warning::Ubuntu mirror too slow; switching to archive.ubuntu.com"
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
        }
        if ! sudo timeout 2m apt-get update; then
          avoid_azure
          sudo timeout 2m apt-get update
        fi
        if [[ "$PGDG" == "true" ]]; then
          sudo apt-get install --yes --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        fi
        # Start from an empty archive so the saved set holds only these packages.
        sudo apt-get clean
        # Download first, so a slow download can be stopped without interrupting
        # dpkg. If it isn't done in 4 minutes, finish from archive.ubuntu.com within
        # 6 more. The limits keep the whole action inside the calling step's
        # 15 minutes; the index refresh is optional because the lists already
        # name both mirrors' files.
        if ! sudo timeout 4m apt-get install --yes --no-install-recommends \
          --download-only "${packages[@]}"; then
          avoid_azure
          sudo timeout 1m apt-get update || echo "::warning::Index refresh skipped"
          sudo timeout 6m apt-get install --yes --no-install-recommends \
            --download-only "${packages[@]}"
        fi

        rm -rf "$DIRECTORY"
        mkdir -p "$DIRECTORY"
        shopt -s nullglob
        downloaded=(/var/cache/apt/archives/*.deb)
        if (( ${#downloaded[@]} > 0 )); then
          cp "${downloaded[@]}" "$DIRECTORY"/
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi
        sudo apt-get install --yes --no-install-recommends "${packages[@]}"

    - name: Save downloaded packages
      if: steps.install.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.directory }}
        key: ${{ steps.key.outputs.key }}
