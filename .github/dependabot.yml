version: 2

# One weekly pull request per ecosystem for minor and patch updates. Each major update
# opens its own pull request.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Version updates wait a week after a release, so a compromised release is more
    # likely to be caught and pulled first. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The service runs on Node.js 24 (package.json engines). Raise this with the runtime.
      - dependency-name: "@types/node"
        versions: [">=25"]

  # Both Dockerfiles pin node:24-bookworm-slim by digest; each new digest of that tag
  # arrives as a pull request.
  - package-ecosystem: docker
    directories: ["/", "/deploy/transcriber"]
    schedule:
      interval: weekly
    # Version updates wait a week after a release, so a compromised release is more
    # likely to be caught and pulled first. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    # Workflows, and the composite actions under .github/actions.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    # Version updates wait a week after a release, so a compromised release is more
    # likely to be caught and pulled first. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
