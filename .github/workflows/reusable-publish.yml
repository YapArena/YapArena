name: Reusable image publication

# Builds one production image variant with SBOM and provenance, pushes it by digest without a
# tag, scans that pushed digest, and only then adds the tags. A tag therefore always names a
# digest that passed the scan. An existing first tag is reported and never rebuilt or moved.

on:
  workflow_call:
    inputs:
      variant:
        description: "web, or encoder (the same image built with MEDIA_WORKER_TOOLS=true)"
        type: string
        required: true
      platforms:
        description: Comma-separated platforms to build, scan and publish.
        type: string
        required: true
      tags:
        description: Newline-separated tags. If the first one already exists, nothing is published.
        type: string
        required: true
      version:
        description: Optional org.opencontainers.image.version label.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      TRIVY_IMAGE: aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Prepare image metadata
        id: metadata
        env:
          VARIANT: ${{ inputs.variant }}
          PLATFORMS: ${{ inputs.platforms }}
          TAGS: ${{ inputs.tags }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VARIANT" in
            web)
              suffix=""
              media_worker_tools=false
              ;;
            encoder)
              suffix="-encoder"
              media_worker_tools=true
              ;;
            *)
              echo "Unknown image variant: $VARIANT" >&2
              exit 1
              ;;
          esac

          if [[ ! "$PLATFORMS" =~ ^linux/[a-z0-9]+(,linux/[a-z0-9]+)*$ ]]; then
            echo "Platforms must be a comma-separated list such as linux/amd64" >&2
            exit 1
          fi

          tag_list=()
          while IFS= read -r tag; do
            tag="${tag//[[:space:]]/}"
            [[ -n "$tag" ]] || continue
            if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Invalid image tag: $tag" >&2
              exit 1
            fi
            tag_list+=("$tag")
          done <<< "$TAGS"
          if (( ${#tag_list[@]} == 0 )); then
            echo "At least one tag is required" >&2
            exit 1
          fi

          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')${suffix}"
          {
            echo "name=${image}"
            # Shared with the CI container job, which builds the same image first on main.
            # A new scope each UTC day reruns the base image's apt-get upgrade at least daily.
            echo "cache-scope=image-${VARIANT}-$(date -u +%Y%m%d)"
            echo "media-worker-tools=${media_worker_tools}"
            echo "first-tag=${tag_list[0]}"
            echo "tags<<EOF"
            printf '%s\n' "${tag_list[@]}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            if [[ -n "$VERSION" ]]; then
              echo "org.opencontainers.image.version=${VERSION}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure QEMU
        if: contains(inputs.platforms, 'linux/arm64')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Configure multi-platform builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Check for an existing publication
        id: existing
        env:
          IMAGE: ${{ steps.metadata.outputs.name }}
          FIRST_TAG: ${{ steps.metadata.outputs.first-tag }}
        run: |
          if manifest="$(docker buildx imagetools inspect "${IMAGE}:${FIRST_TAG}" \
            --format '{{json .Manifest}}' 2> /dev/null)"; then
            digest="$(jq --raw-output '.digest' <<< "$manifest")"
            echo "${IMAGE}:${FIRST_TAG} already exists at ${digest}; nothing is rebuilt or retagged."
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the image by digest
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          target: production
          build-args: MEDIA_WORKER_TOOLS=${{ steps.metadata.outputs.media-worker-tools }}
          labels: ${{ steps.metadata.outputs.labels }}
          # No tag yet: the digest is tagged only after its scan passes.
          outputs: type=image,name=${{ steps.metadata.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.metadata.outputs.cache-scope }}
          cache-to: type=gha,scope=${{ steps.metadata.outputs.cache-scope }},mode=max
          provenance: mode=max
          sbom: true

      - name: Scan the pushed digest
        if: steps.existing.outputs.digest == ''
        env:
          IMAGE: ${{ steps.metadata.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          # Trivy reads the private package with the ghcr.io login created above.
          registry_config="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          IFS=',' read -ra platform_list <<< "$PLATFORMS"
          for platform in "${platform_list[@]}"; do
            echo "Scanning ${IMAGE}@${DIGEST} for ${platform}"
            docker run --rm \
              --env DOCKER_CONFIG=/registry-auth \
              --volume "${registry_config}:/registry-auth/config.json:ro" \
              --volume "${RUNNER_TEMP}/trivy-cache:/trivy-cache" \
              "$TRIVY_IMAGE" \
              image --no-progress --cache-dir /trivy-cache --image-src remote --platform "$platform" \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "${IMAGE}@${DIGEST}"
          done

      - name: Tag the scanned digest
        if: steps.existing.outputs.digest == ''
        env:
          IMAGE: ${{ steps.metadata.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          resolve() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' \
              | jq --raw-output '.digest'
          }

          # Existing tags are never moved. Check every tag before creating any.
          new_tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            if current="$(resolve "${IMAGE}:${tag}" 2> /dev/null)"; then
              if [[ "$current" != "$DIGEST" ]]; then
                echo "Refusing to move ${IMAGE}:${tag} from ${current} to ${DIGEST}" >&2
                exit 1
              fi
            else
              new_tags+=("$tag")
            fi
          done <<< "$TAGS"

          for tag in "${new_tags[@]}"; do
            docker buildx imagetools create --tag "${IMAGE}:${tag}" "${IMAGE}@${DIGEST}"
            resolved="$(resolve "${IMAGE}:${tag}")"
            if [[ "$resolved" != "$DIGEST" ]]; then
              echo "${IMAGE}:${tag} resolves to ${resolved}, not the scanned ${DIGEST}" >&2
              exit 1
            fi
          done

      - name: Publish image summary
        env:
          VARIANT: ${{ inputs.variant }}
          IMAGE: ${{ steps.metadata.outputs.name }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ inputs.platforms }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "No published digest was recorded" >&2
            exit 1
          fi
          {
            echo "## ${VARIANT} image"
            echo '```text'
            echo "${IMAGE}@${digest}"
            echo '```'
            echo "Platforms: ${PLATFORMS}. Tags: $(paste -sd ' ' <<< "$TAGS")."
            if [[ -n "$EXISTING_DIGEST" ]]; then
              echo "An earlier run already published and scanned this tag; this run changed nothing."
            else
              echo "Trivy found no fixable HIGH or CRITICAL vulnerabilities in this pushed digest."
            fi
            echo "Deploy the digest above, not a mutable tag."
          } >> "$GITHUB_STEP_SUMMARY"
