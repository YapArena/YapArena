name: ${COMPOSE_PROJECT_NAME:-yaparena}

services:
  app:
    build:
      context: .
      target: production
    image: ${LOCAL_IMAGE:-yaparena:local}
    environment:
      NODE_ENV: development
      NODE_OPTIONS: ${NODE_OPTIONS:---max-semi-space-size=4}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-10kb}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-300}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      SESSION_DURATION_MS: ${SESSION_DURATION_MS:-604800000}
      COMMUNITY_STREAM_ENABLED: ${COMMUNITY_STREAM_ENABLED:-false}
      COMMUNITY_MAX_STREAMS: ${COMMUNITY_MAX_STREAMS:-500}
      COMMUNITY_MAX_ROOMS: ${COMMUNITY_MAX_ROOMS:-50}
      # Local only; must match the credentials in monitoring/prometheus.yml.
      METRICS_TOKEN: local-development-metrics-token-not-a-secret
      DATABASE_URL: postgresql://yaparena_runtime:${DATABASE_RUNTIME_PASSWORD:?Set DATABASE_RUNTIME_PASSWORD in .env}@db:5432/${POSTGRES_DB:-yaparena}
    ports:
      - "${HOST_PORT:-3000}:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://127.0.0.1:3000/ready")
            .then((response) => {
              if (!response.ok) process.exit(1);
            })
            .catch(() => process.exit(1));
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  provision:
    build:
      context: .
      target: production
    image: ${LOCAL_IMAGE:-yaparena:local}
    profiles: [release]
    command: [node, scripts/provision-database.ts]
    environment:
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:-yaparena}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-yaparena}
      DATABASE_OWNER_PASSWORD: ${DATABASE_OWNER_PASSWORD:?Set DATABASE_OWNER_PASSWORD in .env}
      DATABASE_RUNTIME_PASSWORD: ${DATABASE_RUNTIME_PASSWORD:?Set DATABASE_RUNTIME_PASSWORD in .env}
      DATABASE_ENCODER_PASSWORD: ${DATABASE_ENCODER_PASSWORD:?Set DATABASE_ENCODER_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: production
    image: ${LOCAL_IMAGE:-yaparena:local}
    profiles: [release]
    command: [node, scripts/migrate-database.ts]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://yaparena_owner:${DATABASE_OWNER_PASSWORD:?Set DATABASE_OWNER_PASSWORD in .env}@db:5432/${POSTGRES_DB:-yaparena}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yaparena}
      POSTGRES_USER: ${POSTGRES_USER:-yaparena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-development-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
  postgres-data:
  prometheus-data:
