name = "yaparena-replay"
main = "replay-worker.ts"
compatibility_date = "2026-10-06"
workers_dev = false

# The edge's own HTTPS hostname, for example replay.yaparena.com in production.
# The app's MEDIA_REPLAY_EDGE_URL is this origin.
routes = [
  { pattern = "replay.your-app.example", custom_domain = true },
]

[vars]
# The exact application origin, for example https://yaparena.com: no www,
# no path and no trailing slash. CORS allows only this origin.
APP_ORIGIN = "https://your-app.example"

[[r2_buckets]]
binding = "REPLAY_BUCKET"
bucket_name = "your-private-media-bucket"

# Set REPLAY_SIGNING_SECRET through the provider secret store, never this file.
# Disable public bucket URLs.
